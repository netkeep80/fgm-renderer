format: repo-guard/requirement-v1
id: FGMV-PORT-001
normative: "### FGMV-PORT-001 — Один синтетический пакет FGM должен давать согласованный кадр в нативной сборке и браузере через общее ядро и WGSL. Браузерный путь должен запускать WebAssembly, сообщать об отсутствии WebGPU и восстанавливать устройство после его потери. CI должен собирать обе версии и проверять кадры и диагностику на тестовых данных."
